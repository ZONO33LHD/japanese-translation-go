name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # 辞書のバージョンを固定する。上げるときは fixture の期待値も見直す。
  SUDACHI_DICT_VERSION: "20260723"
  # 取得した zip の SHA-256。辞書を差し替えられても解析器に渡す前に止める。
  SUDACHI_DICT_SHA256: "b6e835f63440f97474c2da45d80950f73746e632e40bbfc168b4041729135e1f"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Cache Sudachi dictionary
        id: dict-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/sudachi
          key: sudachidict-core-${{ env.SUDACHI_DICT_VERSION }}-v2

      # 辞書は外部の配布サーバーではなく、このリポジトリの Release に再配布したものを使う。
      - name: Download Sudachi dictionary
        if: steps.dict-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/sudachi
          gh release download "sudachidict-core-${SUDACHI_DICT_VERSION}" \
            --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --output .cache/sudachi/dict.zip
          echo "${SUDACHI_DICT_SHA256}  .cache/sudachi/dict.zip" | sha256sum -c -
          unzip -o -j .cache/sudachi/dict.zip '*.dic' -d .cache/sudachi

      - name: Export dictionary paths
        run: |
          echo "SUDACHIN_DICT=$GITHUB_WORKSPACE/.cache/sudachi/system_core.dic" >> "$GITHUB_ENV"
          echo "NJ_DICT_ARCHIVE=$GITHUB_WORKSPACE/.cache/sudachi/dict.zip" >> "$GITHUB_ENV"

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: test
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1
